name: Checks

on:
  push:
    branches: [main]
  pull_request:

# Read-only: a pull request can't use this workflow to change the repo.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions are pinned to exact commits, so a moved tag can't swap the code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Tests and security guard
        run: ./tests/run.sh
      - name: Shell scripts
        run: shellcheck install.sh tests/run.sh
